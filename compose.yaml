services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: analyzer-coder-postgres
    environment:
      POSTGRES_DB: codebase_kb
      POSTGRES_USER: codebase_kb
      POSTGRES_PASSWORD: codebase_kb
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codebase_kb -d codebase_kb"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  postgres-data:
