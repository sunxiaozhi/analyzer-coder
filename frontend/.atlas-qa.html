<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>代码图谱 · 本地数据验收</title><style>body{margin:0;padding:20px;background:#eef2f7}#app{height:calc(100vh - 40px)}@media(max-width:760px){body{padding:8px}#app{height:auto}}</style></head><body><div id="app"></div><script type="module">
import { createApp } from 'vue';
