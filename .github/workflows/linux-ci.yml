name: Linux CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: codebase_kb
          POSTGRES_USER: codebase_kb
          POSTGRES_PASSWORD: integration-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U codebase_kb -d codebase_kb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      APP_DATASOURCE_URL: jdbc:postgresql://127.0.0.1:5432/codebase_kb
      APP_DATASOURCE_USERNAME: codebase_kb
      APP_DATASOURCE_PASSWORD: integration-postgres-password
      APP_INITIAL_ADMIN_USERNAME: integration-admin
      APP_INITIAL_ADMIN_PASSWORD: Integration-Admin-Password-123!
      APP_LLM_MASTER_KEY: integration-llm-master-key-at-least-24-chars
      APP_CREDENTIAL_MASTER_KEY: integration-credential-master-key-32-chars
      APP_REPOSITORY_ALLOWED_ROOTS: /tmp
      APP_MANAGED_DATA_ROOT: /tmp/analyzer-coder-ci
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set up Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Validate startup scripts
        run: |
          bash -n scripts/start.sh
          pwsh -NoProfile -File scripts/start.ps1 -Help

      - name: Validate quality and deterministic CI clients
        run: |
          node scripts/evaluate-quality.mjs --validate
          node --test scripts/evaluate-quality.test.mjs
          node --test scripts/ci-task-review.test.mjs

      - name: Test MCP thin adapter
        working-directory: mcp-server
        run: |
          npm ci
          npm test

      - name: Test backend on Linux
        run: mvn -pl backend -am test

      - name: Test real PostgreSQL and pgvector integration
        env:
          APP_RUN_POSTGRES_IT: 'true'
        run: mvn -pl backend -Dtest='*IT' test

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build

      - name: Package backend
        run: mvn -pl backend -am package -DskipTests

      - name: Enforce release quality gate
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          test -f evaluation/results/release.json
          node scripts/evaluate-quality.mjs --results evaluation/results/release.json

      - name: Assemble release artifact
        run: |
          mkdir -p release/backend release/frontend release/deploy
          cp backend/target/codebase-knowledge-backend-1.0.0.jar release/backend/analyzer-coder.jar
          cp -R frontend/dist/. release/frontend/
          cp deploy/.env.production.example release/deploy/
          cp deploy/analyzer-coder.service release/deploy/
          cp deploy/analyzer-coder.env.example release/deploy/
          cp deploy/README.md release/deploy/
          cp deploy/nginx-host.conf release/deploy/
          cp deploy/nginx-compose-edge.conf release/deploy/

      - name: Upload Linux release artifact
        uses: actions/upload-artifact@v7
        with:
          name: analyzer-coder-linux-${{ github.sha }}
          path: release
          if-no-files-found: error
          retention-days: 14
