name: Linux CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set up Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Validate startup scripts
        run: |
          bash -n scripts/start.sh
          pwsh -NoProfile -File scripts/start.ps1 -Help

      - name: Test backend on Linux
        run: mvn -pl backend -am test

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Package backend
        run: mvn -pl backend -am package -DskipTests

      - name: Assemble release artifact
        run: |
          mkdir -p release/backend release/frontend release/deploy
          cp backend/target/codebase-knowledge-backend-1.0.0.jar release/backend/analyzer-coder.jar
          cp -R frontend/dist/. release/frontend/
          cp deploy/.env.production.example release/deploy/
          cp deploy/analyzer-coder.service release/deploy/
          cp deploy/analyzer-coder.env.example release/deploy/
          cp deploy/README.md release/deploy/
          cp deploy/nginx-host.conf release/deploy/
          cp deploy/nginx-compose-edge.conf release/deploy/

      - name: Upload Linux release artifact
        uses: actions/upload-artifact@v7
        with:
          name: analyzer-coder-linux-${{ github.sha }}
          path: release
          if-no-files-found: error
          retention-days: 14