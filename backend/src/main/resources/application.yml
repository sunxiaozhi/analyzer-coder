spring:
  application:
    name: codebase-knowledge-backend
  datasource:
    url: ${APP_DATASOURCE_URL:jdbc:postgresql://localhost:5432/codebase_kb}
    username: ${APP_DATASOURCE_USERNAME:codebase_kb}
    password: ${APP_DATASOURCE_PASSWORD:codebase_kb}
  flyway:
    enabled: ${APP_FLYWAY_ENABLED:true}
    placeholders:
      repositoryMigrationOwner: ${APP_REPOSITORY_MIGRATION_OWNER:}

mybatis:
  mapper-locations: classpath*:/mappers/**/*.xml
  type-handlers-package: com.analyzercoder.infrastructure.persistence.type
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    local-cache-scope: statement
    jdbc-type-for-null: 'NULL'


pagehelper:
  helper-dialect: postgresql
  reasonable: false
  page-size-zero: false
  support-methods-arguments: false
server:
  port: ${APP_SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

app:
  security:
    initial-admin-username: ${APP_INITIAL_ADMIN_USERNAME:}
    initial-admin-password: ${APP_INITIAL_ADMIN_PASSWORD:}
    session-idle-minutes: ${APP_SESSION_IDLE_MINUTES:30}
    session-max-hours: ${APP_SESSION_MAX_HOURS:12}
    lock-minutes: ${APP_LOGIN_LOCK_MINUTES:15}
  repository:
    allowed-roots: ${APP_REPOSITORY_ALLOWED_ROOTS:.}
    managed-data-root: ${APP_MANAGED_DATA_ROOT:${java.io.tmpdir}/analyzer-coder}
    snapshot-root: ${app.repository.managed-data-root}/repositories
    import-root: ${app.repository.managed-data-root}/staging/imports
    snapshot-max-files: ${APP_REPOSITORY_SNAPSHOT_MAX_FILES:20000}
    snapshot-max-total-bytes: ${APP_REPOSITORY_SNAPSHOT_MAX_TOTAL_BYTES:2147483648}
    browser-max-file-bytes: ${APP_REPOSITORY_BROWSER_MAX_FILE_BYTES:2097152}
  indexing:
    poll-interval-ms: 5000
    max-file-bytes: 524288
  codegraph:
    executable: ${APP_CODEGRAPH_EXECUTABLE:codegraph}
    timeout-minutes: ${APP_CODEGRAPH_TIMEOUT_MINUTES:10}
    artifact-root: ${app.repository.managed-data-root}/repositories
  llm:
    master-key: ${APP_LLM_MASTER_KEY:analyzer-coder-local-development-key}
    allow-insecure-local: ${APP_LLM_ALLOW_INSECURE_LOCAL:false}
    connectivity-timeout-seconds: ${APP_LLM_CONNECTIVITY_TIMEOUT_SECONDS:15}
    breaker-failure-threshold: ${APP_LLM_BREAKER_FAILURE_THRESHOLD:3}
