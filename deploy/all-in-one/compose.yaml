name: analyzer-coder
services:
  analyzer:
    image: ${ANALYZER_IMAGE:-analyzer-coder:1.0.0}
    restart: unless-stopped
    stop_grace_period: 60s
    labels:
      com.analyzer-coder.installation: ${ANALYZER_INSTALLATION_ROOT:?Use analyzer.sh or analyzer.ps1}
    ports:
      - "${APP_HTTP_BIND_ADDRESS:-0.0.0.0}:${APP_HTTP_PORT:-18081}:8080"
    env_file: .env
    volumes:
      - type: bind
        source: ./data
        target: /data
      - type: bind
        source: ./config
        target: /config
        read_only: true
