name: analyzer-coder
services:
  analyzer:
    image: ${ANALYZER_IMAGE:-analyzer-coder:1.0.0}
    restart: unless-stopped
    stop_grace_period: 60s
    ports:
      - "${APP_HTTP_BIND_ADDRESS:-0.0.0.0}:${APP_HTTP_PORT:-18081}:8080"
    env_file: .env
    volumes:
      - analyzer-data:/data
volumes:
  analyzer-data:
