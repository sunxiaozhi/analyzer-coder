server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 60m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /component-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Serve the SPA entry through an exact location so a missing/unreadable
    # index.html returns 404 instead of recursively redirecting to itself.
    # Hashed build assets must exist as files. Never return index.html for a
    # missing JS/CSS request because browsers reject HTML MIME types.
    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        try_files /index.html =404;
        expires -1;
    }

    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }

    location /actuator {
        return 404;
    }

    location /api/ {
        proxy_pass http://host.docker.internal:18082;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }
}
