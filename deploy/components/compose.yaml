name: analyzer-coder-components

services:
  postgres:
    image: ${POSTGRES_IMAGE:?Set POSTGRES_IMAGE in components/.env}
    pull_policy: missing
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-codebase_kb}
      POSTGRES_USER: ${POSTGRES_USER:-codebase_kb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in components/.env}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - type: ${POSTGRES_STORAGE_TYPE:-volume}
        source: ${POSTGRES_DATA_SOURCE:-postgres-data}
        target: /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  nginx:
    image: ${NGINX_IMAGE:?Set NGINX_IMAGE in components/.env}
    pull_policy: missing
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${APP_HTTP_BIND_ADDRESS:-0.0.0.0}:${APP_HTTP_PORT:-8088}:8080"
    volumes:
      - type: bind
        source: ../frontend/dist
        target: /usr/share/nginx/html
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./nginx/nginx.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=-", "http://127.0.0.1:8080/component-health"]
      interval: 10s
      timeout: 5s
      retries: 6

# The postgres-data key is used when POSTGRES_STORAGE_TYPE=volume.
# POSTGRES_VOLUME controls the Docker engine volume name; bind mode leaves it unused.
volumes:
  postgres-data:
    name: ${POSTGRES_VOLUME:-analyzer-coder-components_postgres-data}
